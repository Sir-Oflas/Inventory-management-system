name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Installa Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Installa PyInstaller
        run: python -m pip install pyinstaller

      - name: Crea InventoryIMS.exe
        run: python -m PyInstaller --onefile --windowed --name InventoryIMS main.py

      - name: Prepara EXE da scaricare
        uses: actions/upload-artifact@v4
        with:
          name: InventoryIMS-Windows
          path: dist/InventoryIMS.exe
